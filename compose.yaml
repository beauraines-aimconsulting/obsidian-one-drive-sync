services:
  obsidian-sync:
    build:
      context: .
    image: obsidian-one-drive-sync:local
    init: true
    environment:
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:?Set GRAPH_CLIENT_ID in .env}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-common}
      ONEDRIVE_FOLDER: ${ONEDRIVE_FOLDER:-ObsidianPublished}
      HEALTH_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBOUNCE_DELAY: ${DEBOUNCE_DELAY:-300}
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-true}
      WATCH_POLL_INTERVAL: ${WATCH_POLL_INTERVAL:-1000}
    volumes:
      - ${HOST_VAULT_PATH:?Set HOST_VAULT_PATH in .env}:/vault:ro
      - ${HOST_RULES_CONFIG_PATH:?Set HOST_RULES_CONFIG_PATH in .env}:/config/rules.json:ro
      - sync-state:/home/node/.obsidian-sync
    ports:
      - "${HEALTH_PORT:-8080}:8080"

volumes:
  sync-state:
